<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EBDF">
<title>MatchaUchi · เมนูสั่งมัทฉะ</title>
<link rel="manifest" href="/manifest.webmanifest">
<!-- iOS reads none of the manifest's display or icon fields, so it is told
     the same things again in its own vocabulary. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MatchaUchi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Palette sampled from the printed menu: one warm brown ink on paper, with the
   logo green as the only accent — lifted to a lighter, airier stock.

   This page deliberately stays in its light, paper world rather than following
   the device's dark preference: it stands in for a printed cafe menu, and an
   inverted one reads as a different object. The viewer's explicit toggle is
   still honoured below. */
/* Thai sits optically smaller than Latin at the same px size, and its tone
   marks need room. Restricting a face to the Thai block lets it be scaled and
   spaced independently without wrapping every string in markup. Only locally
   installed faces are referenced, so nothing is fetched. */
@font-face{
  font-family:"UiThai";
  src:local("Noto Sans Thai"), local("Sukhumvit Set"), local("IBM Plex Sans Thai"),
      local("Leelawadee UI"), local("Thonburi"), local("Tahoma");
  unicode-range:U+0E01-0E5B;
  size-adjust:108%;
  font-display:swap;
}
:root{
  --paper:#F1EBDF;
  --surface:#F1EBDF;
  --sunk:#E9E2D3;
  --ink:#4A3A2B;
  --ink-mid:#5F4E3B;
  --ink-soft:#6B5A46;
  --ink-faint:#75634E;
  --rule:#D3C9B4;
  --rule-soft:#E0D8C6;
  --matcha:#476C44;
  --matcha-deep:#3A5B38;
  --on-matcha:#F5F1E7;
  --danger:#93422F;
  --warn:#7A5E1E;
  --r-s:3px; --r-m:10px; --r-l:16px;
  --sans:"UiThai",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --paper:#191410; --surface:#211B15; --sunk:#2A231B;
  --ink:#EFE6D6; --ink-mid:#D8CBB6; --ink-soft:#AC9C84; --ink-faint:#97876F;
  --rule:#39301F; --rule-soft:#2F2819;
  --matcha:#8FB183; --matcha-deep:#A6C39A; --on-matcha:#16200F;
  --danger:#D98D79;
  --warn:#D9B15E;
}
:root[data-theme="light"]{
  --paper:#F1EBDF; --surface:#F1EBDF; --sunk:#E9E2D3;
  --ink:#4A3A2B; --ink-mid:#5F4E3B; --ink-soft:#6B5A46; --ink-faint:#75634E;
  --rule:#D3C9B4; --rule-soft:#E0D8C6;
  --matcha:#476C44; --matcha-deep:#3A5B38; --on-matcha:#F5F1E7;
  --danger:#93422F;
  --warn:#7A5E1E;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--paper);}
/* The kraft stock itself, lifted from the menu PDF and tiled. Drawn at half the
   swatch's pixel size so the grain reads fine rather than blotchy. */
.stage{
  min-height:100vh; display:flex; justify-content:center;
  background-color:var(--paper);
  background-image:url("data:image/webp;base64,__PAPER_B64__");
  background-size:120px 120px;
}
.app{
  width:100%; max-width:460px; min-height:100vh;
  background-color:var(--surface);
  background-image:url("data:image/webp;base64,__PAPER_B64__");
  background-size:120px 120px;
  font-family:var(--sans); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; padding-bottom:96px; position:relative;
}
img{max-width:100%;}
button{font-family:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--matcha); outline-offset:2px;}

/* ---------- masthead ---------- */
.masthead{padding:26px 22px 18px; text-align:center; position:relative;}
.masthead::after{content:""; position:absolute; left:22px; right:22px; bottom:0; height:1px; background:var(--rule);}
/* The shop's own brush lettering, rather than a typeface standing in for it.
   The emblem is scaled to sit with the wordmark as one lockup, close to the
   proportions they hold in the original logo. */
.emblem{width:112px; height:auto; display:block; margin:0 auto 12px;}
.wordmark{margin:0; line-height:0;}
.wordmark img{width:168px; height:auto; display:block; margin:0 auto;}
.tagline{font-size:9px; letter-spacing:.2em; color:var(--ink-faint); margin-top:11px; text-transform:uppercase;}
.branch{
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  margin-top:12px; display:inline-flex; align-items:center; gap:7px;
  font-size:13.5px; font-weight:600; color:var(--matcha); letter-spacing:.01em;
}
.branch::before,.branch::after{content:""; width:14px; height:1px; background:var(--matcha); opacity:.45;}
/* Hidden until this device is marked as the owner's; JS sets the display. */
.owner-tools{position:absolute; top:18px; right:16px; display:none; gap:8px;}
.leave{
  width:100%; text-align:left; background:none; border:none; cursor:pointer;
  font-size:13px; color:var(--danger); padding:6px 0;
}
.gear{
  width:40px; height:40px; border-radius:50%;
  border:1px solid var(--rule); background:transparent; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.gear:hover{color:var(--ink); border-color:var(--ink-faint);}
.gear svg{width:15px; height:15px;}

/* ---------- shop status ---------- */
/* Main line (open/busy/closed) and the hours detail stack on their own lines
   rather than run together in one string. */
.status{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:11px 22px; text-align:center;
  border-bottom:1px solid var(--rule);
}
.status-main{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;}
.status .dot{width:8px; height:8px; border-radius:50%; flex:none; background:currentColor;}
.status-detail{font-size:12px; font-weight:500; color:var(--ink-soft);}
.status.open .status-main{color:var(--matcha);}
.status.busy .status-main{color:var(--warn);}
.status.closed .status-main{color:var(--danger);}
/* Stepping out is a pause, not a shutter -- it reads as a caution, like busy,
   rather than the red of a closed shop. */
.status.brk .status-main{color:var(--warn);}

/* ---------- notices ---------- */
.notices{padding:4px 22px 0;}
.notice{display:flex; gap:10px; padding:14px 0; border-bottom:1px solid var(--rule-soft);}
.notice:last-child{border-bottom:none;}
.notice .ic{font-size:14px; line-height:1.5; flex:none;}
.notice p{margin:0; font-size:12px; line-height:1.65; color:var(--ink-soft);}

/* ---------- shared section label ---------- */
.eyebrow{
  font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600;
}

/* ---------- row list (categories + items) ---------- */
.list{display:flex; flex-direction:column;}
.row{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:14px 22px; background:none; border:none; border-bottom:1px solid var(--rule-soft);
  cursor:pointer;
}
.row:hover{background:var(--sunk);}
.row.off{opacity:.42; cursor:default;}
.row.off:hover{background:none;}
.row .thumb{width:58px; height:58px; border-radius:var(--r-s); object-fit:contain; flex:none;}
/* These are spans inside a button; without an explicit block they would run
   together on one line instead of stacking. */
.row .body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
.row .body > span{display:block;}
.row .title{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.row .name{font-size:14.5px; font-weight:600; letter-spacing:.005em;}
.row .meta{font-size:12px; color:var(--ink-soft);}
.row .notes{font-size:11.5px; color:var(--ink-faint); line-height:1.55;}
.row .thai{font-size:12px; color:var(--ink-soft); line-height:1.65;}
.row .end{display:flex; align-items:center; gap:8px; flex:none;}
.price{font-size:13px; font-weight:600; color:var(--matcha); font-variant-numeric:tabular-nums; white-space:nowrap;}
.price small{display:block; font-size:9px; font-weight:500; color:var(--ink-faint); text-align:right; letter-spacing:.06em;}
.chev{width:13px; height:13px; color:var(--ink-faint); flex:none;}
.crown{width:11px; height:11px; color:var(--matcha); flex:none;}
.flag{
  font-size:9px; font-weight:600; letter-spacing:.05em; color:var(--danger);
  border:1px solid currentColor; border-radius:999px; padding:1px 6px;
}

/* ---------- page headers ---------- */
.crumb{padding:14px 22px 0;}

/* The way back. It used to be faint grey text that customers missed, so it is
   now an obvious button, and the bar sticks to the top so it stays reachable
   however far down a long item page they have scrolled. */
.navbar{
  position:sticky; top:0; z-index:5;
  padding:10px 22px;
  background-color:var(--surface);
  background-image:url("data:image/webp;base64,__PAPER_B64__");
  background-size:120px 120px;
  border-bottom:1px solid var(--rule);
}
.back{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 18px 11px 13px;
  background:var(--sunk); border:1px solid var(--rule); border-radius:999px;
  font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer;
}
.back svg{width:16px; height:16px; color:var(--matcha);}
.back:hover{border-color:var(--matcha); color:var(--matcha);}
.back:hover svg{color:var(--matcha);}
.back:active{transform:scale(.98);}
.pagehead{padding:8px 22px 18px; border-bottom:1px solid var(--rule);}
.pagehead h1{margin:4px 0 0; font-size:21px; font-weight:600; letter-spacing:.01em; text-wrap:balance;}
.pagehead .th{font-size:13px; color:var(--ink-mid); margin-top:5px;}
.pagehead .sub{font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.5;}

/* ---------- detail ---------- */
/* Sized like the product renders in the printed menu — present, not a banner. */
.hero{width:172px; height:172px; object-fit:contain; display:block; margin:14px auto 4px;}
.detail-head{padding:6px 22px 20px; border-bottom:1px solid var(--rule); text-align:center;}
.detail-head h1{margin:0; font-size:20px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap;}
.detail-head .tags{font-size:12px; color:var(--ink-faint); margin-top:7px; letter-spacing:.02em;}
.detail-head .thai{font-size:13px; color:var(--ink-mid); margin-top:8px; line-height:1.7;}

.step{padding:16px 22px 6px; border-bottom:1px solid var(--rule);}
.step-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px;}
/* A step's question must outrank the answers beneath it. */
.step-label{font-size:14px; font-weight:600; color:var(--ink); letter-spacing:0;}
.opt{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid var(--rule-soft);
  padding:12px 0; cursor:pointer; font-size:13px;
}
.step .opt:last-child{border-bottom:none;}
.opt .dot{width:17px; height:17px; border-radius:50%; border:1.5px solid var(--rule); flex:none; position:relative;}
.opt .lbl{flex:1; color:var(--ink-mid);}
.opt .tail{font-size:12.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap;}
.opt.sel .dot{border-color:var(--matcha);}
.opt.sel .dot::after{content:""; position:absolute; inset:3.5px; border-radius:50%; background:var(--matcha);}
.opt.sel .lbl{color:var(--matcha); font-weight:600;}
.opt.sel .tail{color:var(--matcha); font-weight:600;}
.opt.off{opacity:.4; cursor:not-allowed;}
.opt.off .tail{color:var(--danger);}
.served{font-size:12px; color:var(--ink-soft); padding:2px 0 14px;}

.qty{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--rule);}
.qty .lbl{font-size:13px; color:var(--ink-mid);}
.stepper{display:flex; align-items:center; gap:16px;}
.stepper button{
  width:42px; height:42px; border-radius:50%; border:1px solid var(--rule);
  background:none; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.stepper span{font-size:14.5px; font-variant-numeric:tabular-nums; min-width:16px; text-align:center;}

.actions{padding:20px 22px 26px;}
.btn{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 18px; border:none; border-radius:var(--r-m); cursor:pointer;
  background:var(--matcha); color:var(--on-matcha); font-size:13.5px; font-weight:600;
}
.btn[disabled]{opacity:.42; cursor:not-allowed;}
.btn .r{font-variant-numeric:tabular-nums;}
.btn.quiet{background:none; border:1px solid var(--rule); color:var(--ink-mid); justify-content:center;}

/* ---------- basket bar ---------- */
.basket{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:460px; display:none; align-items:center; justify-content:space-between;
  gap:12px; padding:14px 22px; background:var(--matcha); color:var(--on-matcha);
  border:none; cursor:pointer; font-size:13px; font-weight:600; z-index:8;
}
.basket.on{display:flex;}
.basket .n{
  background:var(--on-matcha); color:var(--matcha); border-radius:999px;
  min-width:20px; height:20px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; margin-right:8px;
}
.basket .r{font-variant-numeric:tabular-nums;}

/* ---------- cart / summary ---------- */
.line{padding:15px 22px; border-bottom:1px solid var(--rule-soft);}
.line-top{display:flex; justify-content:space-between; gap:12px;}
.line-name{font-size:14px; font-weight:600;}
.line-total{font-size:13px; font-weight:600; color:var(--matcha); font-variant-numeric:tabular-nums;}
.line-opts{font-size:11px; color:var(--ink-soft); line-height:1.7; margin-top:5px;}
.line-drop{background:none; border:none; padding:6px 0 0; font-size:11px; color:var(--danger); cursor:pointer;}
/* Quantity on the left, remove on the right, on one line under the options. */
.line-foot{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:10px;}
.stepper.small{gap:12px;}
.stepper.small button{width:40px; height:40px; font-size:15px;}
.stepper.small span{font-size:13.5px; min-width:14px;}
.tally{display:flex; justify-content:space-between; padding:11px 22px; font-size:12.5px; color:var(--ink-mid);}
.tally .v{font-variant-numeric:tabular-nums;}
.tally.sum{font-size:15px; font-weight:600; color:var(--ink); border-top:1px solid var(--rule); padding-top:15px; margin-top:4px;}
.empty{padding:64px 24px; text-align:center; font-size:13px; color:var(--ink-faint);}

/* ---------- form ---------- */
.field{padding:16px 22px; border-bottom:1px solid var(--rule-soft);}
.field > label{display:block; font-size:14px; font-weight:600; margin-bottom:9px;}
.field input, .field textarea{
  width:100%; border:none; border-bottom:1px solid var(--rule); background:none;
  padding:7px 0; font-family:inherit; font-size:13.5px; color:var(--ink); resize:vertical;
}
.field textarea{min-height:44px; line-height:1.5;}
.field textarea::placeholder, .field input::placeholder{color:var(--ink-faint);}
/* free-text spot, shown only when "other location" is chosen */
.pickup-other{margin-top:10px;}
.field input:focus, .field textarea:focus{outline:none; border-bottom-color:var(--matcha);}
.pay{margin-top:18px; text-align:center;}
/* The code sits on its own white field so nothing crowds the quiet zone. */
.pay img.qr{width:190px; border-radius:var(--r-s); display:block; margin:0 auto;}
.pay .bank{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); margin-top:20px;}
.pay .acct{font-size:23px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.05em; margin-top:6px;}
.pay .who{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}

.slip{
  margin-top:20px; display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:13px; border:1px dashed var(--rule); border-radius:var(--r-m);
  background:none; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
}
.slip:hover{border-color:var(--matcha); color:var(--matcha);}
.slip svg{width:15px; height:15px;}
.slip input{display:none;}
.slip-done{
  margin-top:20px; display:flex; align-items:center; gap:12px;
  border:1px solid var(--rule); border-radius:var(--r-m); padding:10px 12px; text-align:left;
}
.slip-done img{width:44px; height:44px; object-fit:cover; border-radius:var(--r-s); flex:none;}
.slip-done .meta{flex:1; min-width:0;}
.slip-done .nm{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.slip-done .sz{font-size:11px; color:var(--ink-faint); margin-top:2px;}
.slip-done button{background:none; border:none; color:var(--danger); font-size:11.5px; cursor:pointer; padding:6px; flex:none;}
.foot{padding:26px 22px 14px; text-align:center; border-top:1px solid var(--rule); margin-top:6px;}
.foot .lbl{font-size:14px; font-weight:600; color:var(--ink); letter-spacing:.01em;}
.foot .tel{display:flex; justify-content:center; flex-wrap:wrap; gap:4px 18px; margin-top:4px;}
.foot a{
  font-size:12.5px; font-weight:600; color:var(--matcha); text-decoration:none;
  font-variant-numeric:tabular-nums; letter-spacing:.02em; padding:12px 8px;
}
.foot a:hover{text-decoration:underline;}

.err{font-size:12px; color:var(--danger); margin-top:8px; line-height:1.5;}
.req{color:var(--danger); font-weight:400; margin-left:3px;}

/* ---------- confirmation ---------- */
.done{padding:44px 24px 8px; text-align:center;}
.done svg{width:46px; height:46px; color:var(--matcha); margin:0 auto 16px;}
.done.warn svg{color:var(--warn);}
.done.warn h1{color:var(--warn);}
.done h1{margin:0 0 6px; font-size:19px; font-weight:600;}
.done p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.7;}

/* ---------- the wait, counted down ---------- */
.wait{
  margin:22px 22px 0; padding:20px 18px; text-align:center;
  background:var(--sunk); border:1px solid var(--rule); border-radius:var(--r-l);
}
.wait .lbl{
  display:block; font-size:11px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-faint);
}
.wait .clock{
  display:block; margin:10px 0 8px; font-size:40px; font-weight:600;
  color:var(--matcha); font-variant-numeric:tabular-nums; letter-spacing:.02em;
  line-height:1;
}
.wait .note{margin:0; font-size:12px; color:var(--ink-soft); line-height:1.7;}
/* The apology is real but secondary -- it should not compete with the time. */
.edit-photo{display:flex; gap:14px; align-items:center; padding:16px 22px 4px;}
.edit-photo img{
  width:84px; height:84px; flex:none; object-fit:cover; border-radius:var(--r-m);
  border:1px solid var(--rule); background:var(--sunk);
}
.edit-photo-side{display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
.edit-prices{display:flex; flex-wrap:wrap; gap:8px; padding:4px 22px 14px;}
.edit-actions{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 22px 22px; border-top:1px solid var(--rule-soft); margin-top:8px;
}
.edit-actions .btn{flex:none; width:auto; padding:11px 22px;}
.spot-drop.danger{color:var(--danger); border-color:var(--danger);}
.qr-show{padding:18px 22px 6px; text-align:center;}
.qr-show canvas{
  width:100%; max-width:260px; height:auto; display:block; margin:0 auto;
  border:1px solid var(--rule); border-radius:var(--r-m); background:#FBF9F4;
  /* the modules are square and must stay square, not be smoothed into mush */
  image-rendering:pixelated;
}
.qr-url{
  margin:12px 0 0; font-size:11.5px; color:var(--ink-soft); word-break:break-all;
  font-variant-numeric:tabular-nums; -webkit-user-select:all; user-select:all;
}
.share-actions{
  display:flex; flex-wrap:wrap; gap:8px; padding:4px 22px 22px;
}
.share-actions .btn{flex:1 1 auto; width:auto; min-width:120px; padding:12px 16px;}
.order-row{
  display:flex; align-items:center; gap:12px;
  padding:9px 22px; border-bottom:1px solid var(--rule-soft);
  background:var(--surface);
}
.order-name{flex:1; min-width:0; font-size:13px; font-weight:600; color:var(--ink);}
.order-name span{
  display:block; font-size:11px; font-weight:500; color:var(--ink-faint);
}
.order-arrows{display:flex; gap:6px; flex:none;}
.order-arrows button{
  width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center;
  background:var(--sunk); border:1px solid var(--rule); border-radius:var(--r-s);
  color:var(--ink-mid); cursor:pointer; padding:0;
}
.order-arrows button svg{width:16px; height:16px;}
.order-arrows button:disabled{opacity:.3; cursor:default;}
.order-arrows button:not(:disabled):hover{border-color:var(--matcha); color:var(--matcha);}

/* Only the shop ever sees this, on an item it has closed. */
.owner-flag{
  margin:0 22px; padding:10px 13px;
  background:var(--sunk); border:1px solid var(--warn); border-radius:var(--r-m);
  font-size:11.5px; line-height:1.6; color:var(--warn);
}
.added-row{
  display:flex; align-items:center; gap:12px;
  padding:11px 22px; border-bottom:1px solid var(--rule-soft);
}
.added-row img{
  width:40px; height:40px; flex:none; object-fit:cover; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--sunk);
}
.added-name{flex:1; min-width:0; font-size:13.5px; font-weight:600; color:var(--ink);}
.added-name span{
  display:block; font-size:11px; font-weight:500; color:var(--ink-faint);
  letter-spacing:.04em; text-transform:uppercase;
}
.branch-field select{
  width:100%; padding:10px 12px; font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-s);
}
.sheet-hint{
  margin:0; padding:2px 22px 14px; font-size:11px; color:var(--ink-faint); line-height:1.65;
}
.brk-row .lbl{font-size:13px;}
.wait .note.soft{
  margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-soft);
  font-size:11px; color:var(--ink-faint);
}
.wait.ring .note.soft{border-top-color:rgba(245,241,231,.28); color:rgba(245,241,231,.78);}
.wait.ring{background:var(--matcha); border-color:var(--matcha);}
.wait.ring .lbl{color:rgba(245,241,231,.72);}
.wait.ring .note{color:var(--on-matcha);}
.wait .bell{width:34px; height:34px; color:var(--on-matcha); margin:0 auto 10px; display:block;}
.wait.ring .big{
  display:block; margin:0 0 8px; font-size:17px; font-weight:600; color:var(--on-matcha);
}
@keyframes bellswing{
  0%,70%,100%{transform:rotate(0)}
  76%{transform:rotate(11deg)} 82%{transform:rotate(-9deg)}
  88%{transform:rotate(6deg)}  94%{transform:rotate(-4deg)}
}
.wait.ring .bell{animation:bellswing 2.6s ease-in-out infinite; transform-origin:50% 12%;}

/* ---------- brief confirmation ---------- */
#toast{
  /* Sits just above the cart bar, so the confirmation and the thing it is
     confirming are in the same place rather than at opposite ends. */
  position:fixed; left:50%; bottom:62px; z-index:40; pointer-events:none;
  transform:translate(-50%,14px); opacity:0;
  padding:11px 20px; border-radius:999px;
  background:var(--matcha); color:var(--on-matcha);
  font-size:13px; font-weight:600; white-space:nowrap;
  box-shadow:0 6px 20px rgba(28,20,12,.22);
  transition:opacity .22s ease, transform .22s ease;
}
#toast.on{opacity:1; transform:translate(-50%,0);}
@media(prefers-reduced-motion:reduce){
  #toast{transition:none;}
  .wait.ring .bell{animation:none;}
}

/* ---------- stock sheet ---------- */
.veil{position:fixed; inset:0; background:rgba(28,20,12,.46); z-index:30; display:flex; justify-content:center; align-items:flex-end;}
.sheet{
  width:100%; max-width:460px; max-height:88vh; overflow-y:auto; background:var(--surface);
  border-top-left-radius:var(--r-l); border-top-right-radius:var(--r-l);
  /* keep a scroll gesture inside the sheet instead of chaining to the page */
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
/* The switches below are positioned, so without a stacking order of its own the
   sticky header gets painted over and the close button stops being clickable. */
.sheet-head{
  position:sticky; top:0; z-index:4; background:var(--surface);
  border-bottom:1px solid var(--rule);
  padding:18px 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
}
.sheet-head button{position:relative; z-index:5;}
.sheet-head h2{margin:0; font-size:15px; font-weight:600;}
.sheet-head p{margin:5px 0 0; font-size:11px; color:var(--ink-faint); line-height:1.6;}
.sheet-head button{width:28px; height:28px; border-radius:50%; border:1px solid var(--rule); background:none; cursor:pointer; flex:none;}
.sheet-section{
  margin:0; padding:24px 22px 10px; font-size:15px; font-weight:600; color:var(--ink);
  border-bottom:1px solid var(--rule);
}
.sw-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 22px; border-bottom:1px solid var(--rule-soft);}
.sw-row .lbl{font-size:13px; color:var(--ink-mid);}
.sw{width:40px; height:23px; border-radius:999px; background:var(--rule); border:none; padding:0; position:relative; cursor:pointer; flex:none;}
/* Keep the switch small but give the finger a full-size target around it. */
.sw::before{content:""; position:absolute; inset:-11px -10px;}
.sw.on{background:var(--matcha);}
.sw::after{content:""; position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%; background:var(--surface); transition:transform .16s;}
.sw.on::after{transform:translateX(17px);}
.sw.locked{opacity:.5; cursor:default; display:inline-block;}
.sw.locked::before{content:none;}

/* ---------- branch details ---------- */
.branch-field{padding:9px 22px; border-bottom:1px solid var(--rule-soft);}
.branch-field label{display:block; font-size:11.5px; color:var(--ink-faint); margin-bottom:5px;}
.branch-field input{
  width:100%; font-family:inherit; font-size:13px; color:var(--ink);
  background:var(--sunk); border:none; border-radius:var(--r-s); padding:9px 10px;
}
.branch-field input:focus{outline:1px solid var(--matcha);}

.spot-row{display:flex; align-items:center; gap:12px; padding:9px 22px; border-bottom:1px solid var(--rule-soft);}
.spot-fields{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;}
.spot-fields input{
  width:100%; font-family:inherit; font-size:12.5px; color:var(--ink);
  background:var(--sunk); border:none; border-radius:var(--r-s); padding:7px 9px;
}
.spot-fields input:focus{outline:1px solid var(--matcha);}
.spot-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
.spot-drop{background:none; border:none; font-size:11px; color:var(--danger); cursor:pointer; padding:6px 0;}
.spot-add{padding:12px 22px; border-bottom:1px solid var(--rule-soft);}
.spot-add button{
  width:100%; background:none; border:1px dashed var(--rule); border-radius:var(--r-m);
  padding:11px; font-family:inherit; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
}
.spot-add button:hover{border-color:var(--matcha); color:var(--matcha);}

.qr-manage{padding:14px 22px; border-bottom:1px solid var(--rule-soft); text-align:center;}
.qr-manage-label{font-size:11.5px; color:var(--ink-faint); margin-bottom:9px; text-align:left;}
.qr-manage img{width:120px; border-radius:var(--r-s); display:block; margin:0 auto 10px;}
.qr-none{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5;}
.qr-pick{
  display:block; border:1px dashed var(--rule); border-radius:var(--r-m);
  padding:11px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
}
.qr-pick:hover{border-color:var(--matcha); color:var(--matcha);}
.qr-pick input{display:none;}

/* ---------- price editor ---------- */
/* Category band. Deliberately not sticky: the sheet header is already sticky,
   and a second sticky layer would slide underneath and vanish. */
.cat-band{
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  padding:9px 22px; background:var(--sunk);
  border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink);
}
.cat-band span{font-size:11px; font-weight:400; letter-spacing:0; color:var(--ink-soft);}
.item-stock{padding:10px 22px; border-bottom:1px solid var(--rule-soft);}
.item-stock-top{display:flex; align-items:center; justify-content:space-between; gap:14px;}
.item-stock-top .lbl{font-size:13px; color:var(--ink-mid); flex:1; min-width:0;}
.item-stock.off .lbl{color:var(--ink-faint);}
.pricerow{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.pricebox{display:flex; align-items:center; gap:5px; background:var(--sunk); border-radius:var(--r-s); padding:4px 7px;}
.plabel{font-size:10px; color:var(--ink-faint); letter-spacing:.02em;}
.pricebox input{
  width:46px; border:none; background:none; font-family:inherit; font-size:12.5px;
  color:var(--ink); font-variant-numeric:tabular-nums; text-align:right; padding:3px 0;
  -moz-appearance:textfield;
}
.pricebox input::-webkit-outer-spin-button,
.pricebox input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.pricebox input:focus{outline:1px solid var(--matcha); border-radius:2px;}
.pricebox.derived{opacity:.72;}
.pderived{font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; width:46px; text-align:right;}

/* ---------- opening hours ---------- */
/* One quiet line per day: name, times, switch. */
.sheet-section .hint{
  display:block; font-size:10.5px; font-weight:400; color:var(--ink-faint);
  margin-top:3px; letter-spacing:0;
}
.hours-row{
  display:flex; align-items:center; gap:12px;
  padding:6px 22px; border-bottom:1px solid var(--rule-soft);
}
.hours-row .lbl{flex:1; min-width:0; font-size:12.5px; color:var(--ink-mid);}
.hours-row.today .lbl{color:var(--matcha); font-weight:600;}
.hours-row.shut .lbl{color:var(--ink-faint);}
.hours-times{display:flex; align-items:center; gap:5px;}
.timesel{
  font-family:inherit; font-size:12.5px; color:var(--ink);
  background:var(--sunk); border:none; border-radius:var(--r-s);
  padding:7px 8px; font-variant-numeric:tabular-nums; cursor:pointer;
  -webkit-appearance:none; appearance:none; text-align:center;
}
.timesel:focus{outline:1px solid var(--matcha);}
.hours-times .dash{color:var(--ink-faint); font-size:12px;}
.hours-times .shutword{display:none; font-size:12px; color:var(--ink-faint);}
.hours-row.shut .timesel, .hours-row.shut .hours-times .dash{display:none;}
.hours-row.shut .hours-times .shutword{display:inline;}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important;}}
</style>

/* The printed menu, kept aside so anything the shop adds can be folded in
   without losing track of which is which. */
const BUILTIN_CATS = CATS.slice();
const BUILTIN_ITEMS = ITEMS.slice();
/* Added categories and items are appended, so the printed menu keeps the order
   it was designed in and new things arrive underneath it. */
function rebuildMenu(){
  CATS.length = 0;  CATS.push.apply(CATS, BUILTIN_CATS.concat(stock.cats));
  ITEMS.length = 0; ITEMS.push.apply(ITEMS, BUILTIN_ITEMS.concat(stock.menu));
  // The shop's own running order, where it has set one. A category the order
  // has never heard of -- one added since -- keeps its place at the back
  // rather than jumping to the front.
  if(stock.order && stock.order.length){
    const rank = new Map(stock.order.map((id,i)=>[id,i]));
    const decorated = CATS.map((c,i)=>({c, i, r:rank.has(c.id) ? rank.get(c.id) : Infinity}));
    decorated.sort((a,b)=> (a.r - b.r) || (a.i - b.i));
    CATS.length = 0;
    CATS.push.apply(CATS, decorated.map(d=>d.c));
  }
}

/* Move one category up or down. The rows are swapped where they stand and
   animated from where they were, so the list is never rebuilt and the sheet
   does not move under the finger that pressed the arrow. */
function moveCat(id, dir){
  const ids = CATS.map(c=>c.id);
  const i = ids.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= ids.length) return;

  ids.splice(j, 0, ids.splice(i, 1)[0]);
  stock.order = ids;
  saveStock(); rebuildMenu();

  const rows = Array.prototype.slice.call(document.querySelectorAll('.order-row'));
  const a = rows.find(r=>r.dataset.order===id), b = rows[j];
  if(!a || !b){ paintSheet(); paint(); return; }

  const before = new Map(rows.map(r=>[r, r.getBoundingClientRect().top]));
  if(dir < 0) b.before(a); else b.after(a);

  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    [a, b].forEach(r=>{
      const shift = before.get(r) - r.getBoundingClientRect().top;
      if(!shift) return;
      r.animate([{transform:'translateY('+shift+'px)'}, {transform:'translateY(0)'}],
        {duration:240, easing:'cubic-bezier(.2,.7,.3,1)'});
    });
  }
  // The arrows at the two ends stop being usable as rows reach them.
  document.querySelectorAll('.order-row').forEach((r, n, list)=>{
    const up = r.querySelector('[data-dir="up"]'), down = r.querySelector('[data-dir="down"]');
    if(up) up.disabled = n === 0;
    if(down) down.disabled = n === list.length - 1;
  });
  paint();   // the customer menu follows immediately
}

function priceOf(it, key){

  return Number.isFinite(v) ? v : it.price[key];
}
function tiers(it){

  const out = [];
  MILK_ORDER.forEach(k=>{

  });

}

/* ---- QR encoding: byte mode, error correction M, versions 1-9 ----
   The address has to be encoded on the phone rather than baked in here: one
   codebase serves every branch, and a picture built at deploy time would show
   Bangkok's address on Pattaya's counter. Level M survives a fingerprint on
   the screen or a poor camera without needing a large code.

   Tables are the standard ones for level M: error-correction codewords per
   block, then each group as [number of blocks, data codewords per block]. */
const QR_EC = {
  1:[10,[1,16]],          2:[16,[1,28]],          3:[26,[1,44]],
  4:[18,[2,32]],          5:[24,[2,43]],          6:[16,[4,27]],
  7:[18,[4,31]],          8:[22,[2,38],[2,39]],   9:[22,[3,36],[2,37]]
};
/* Row and column centres of the alignment patterns. */
const QR_ALIGN = {
  1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],
  6:[6,34], 7:[6,22,38], 8:[6,24,42], 9:[6,26,46]
};

/* GF(256) under x^8 + x^4 + x^3 + x^2 + 1, the field QR arithmetic uses. */
const GF_EXP = new Uint8Array(512), GF_LOG = new Uint8Array(256);
(function(){
  let x = 1;
  for(let i=0;i<255;i++){ GF_EXP[i]=x; GF_LOG[x]=i; x<<=1; if(x & 0x100) x ^= 0x11D; }
  for(let i=255;i<512;i++) GF_EXP[i] = GF_EXP[i-255];
})();
const gfMul = (a,b) => (a===0 || b===0) ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]];

/* The generator polynomial for n error-correction codewords: (x-a^0)...(x-a^n-1) */
function rsGen(n){
  let p = [1];
  for(let i=0;i<n;i++){
    const next = new Array(p.length+1).fill(0);
    for(let j=0;j<p.length;j++){
      next[j]   ^= p[j];
      next[j+1] ^= gfMul(p[j], GF_EXP[i]);
    }
    p = next;
  }
  return p;
}
function rsEncode(data, ecLen){
  const gen = rsGen(ecLen);
  const buf = new Uint8Array(data.length + ecLen);
  buf.set(data);
  for(let i=0;i<data.length;i++){
    const factor = buf[i];
    if(!factor) continue;
    for(let j=0;j<gen.length;j++) buf[i+j] ^= gfMul(gen[j], factor);
  }
  return Array.prototype.slice.call(buf, data.length);
}

/* Text in, interleaved codewords out. */
function qrCodewords(text, version){
  const bytes = Array.from(new TextEncoder().encode(text));
  const spec = QR_EC[version];
  const ecLen = spec[0], groups = spec.slice(1);
  const dataTotal = groups.reduce((n,g)=> n + g[0]*g[1], 0);

  const bits = [];
  const push = (value, len) => { for(let i=len-1;i>=0;i--) bits.push((value>>i) & 1); };
  push(0b0100, 4);        // byte mode
  push(bytes.length, 8);  // one byte of length, for versions 1-9
  bytes.forEach(b=>push(b, 8));

  for(let i=0;i<4 && bits.length < dataTotal*8;i++) bits.push(0);   // terminator
  while(bits.length % 8) bits.push(0);
  const words = [];
  for(let i=0;i<bits.length;i+=8){
    let v = 0;
    for(let j=0;j<8;j++) v = (v<<1) | bits[i+j];
    words.push(v);
  }
  for(let i=0; words.length < dataTotal; i++) words.push(i % 2 ? 0x11 : 0xEC);

  // Split into blocks, then read the blocks column-wise -- damage to one part
  // of the symbol is then spread thinly across every block rather than
  // destroying one outright.
  const blocks = [], ecBlocks = [];
  let at = 0;
  groups.forEach(g=>{
    for(let b=0;b<g[0];b++){
      const block = words.slice(at, at + g[1]);
      at += g[1];
      blocks.push(block);
      ecBlocks.push(rsEncode(block, ecLen));
    }
  });

  const out = [];
  const widest = Math.max.apply(null, blocks.map(b=>b.length));
  for(let i=0;i<widest;i++) blocks.forEach(b=>{ if(i < b.length) out.push(b[i]); });
  for(let i=0;i<ecLen;i++) ecBlocks.forEach(b=>out.push(b[i]));
  return out;
}

/* The smallest version the text fits into. */
function qrVersionFor(text){
  const len = new TextEncoder().encode(text).length;
  for(let v=1; v<=9; v++){
    const spec = QR_EC[v];
    const capacity = spec.slice(1).reduce((n,g)=> n + g[0]*g[1], 0);
    if(len + 2 <= capacity) return v;      // +2 for the mode and length header
  }
  return 0;
}

const qrBch = (value, gen, genBits) => {
  let v = value << (genBits - 1);
  // 17 covers both users: format info reaches bit 14, version info bit 17.
  for(let i = 17; i >= genBits - 1; i--) if(v & (1<<i)) v ^= gen << (i - (genBits-1));
  return v;
};

/* Builds the module matrix: true is dark. */
function qrMatrix(text){
  const version = qrVersionFor(text);
  if(!version) return null;
  const size = version*4 + 17;
  const m = [], fixed = [];
  for(let i=0;i<size;i++){ m.push(new Array(size).fill(false)); fixed.push(new Array(size).fill(false)); }

  const set = (r,c,v) => { m[r][c] = v; fixed[r][c] = true; };

  // Finders, with their separators.
  [[0,0],[0,size-7],[size-7,0]].forEach(p=>{
    for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){
      const rr = p[0]+r, cc = p[1]+c;
      if(rr<0 || cc<0 || rr>=size || cc>=size) continue;
      const edge = (r===0||r===6) && c>=0 && c<=6;
      const side = (c===0||c===6) && r>=0 && r<=6;
      const core = r>=2 && r<=4 && c>=2 && c<=4;
      set(rr, cc, edge || side || core);
    }
  });

  // Timing patterns.
  for(let i=8;i<size-8;i++){ set(6, i, i%2===0); set(i, 6, i%2===0); }

  // Alignment patterns, wherever they do not collide with a finder.
  const centres = QR_ALIGN[version];
  centres.forEach(r=>centres.forEach(c=>{
    if((r<=8 && c<=8) || (r<=8 && c>=size-9) || (r>=size-9 && c<=8)) return;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
      const ring = Math.max(Math.abs(dr), Math.abs(dc));
      set(r+dr, c+dc, ring !== 1);
    }
  }));

  set(size-8, 8, true);            // the dark module, always set

  // Reserve the format areas so data skips them.
  for(let i=0;i<9;i++){ if(!fixed[8][i]) set(8,i,false); if(!fixed[i][8]) set(i,8,false); }
  for(let i=0;i<8;i++){ if(!fixed[8][size-1-i]) set(8,size-1-i,false); if(!fixed[size-1-i][8]) set(size-1-i,8,false); }
  if(version >= 7){
    const info = (version<<12) | qrBch(version, 0b1111100100101, 13);
    for(let i=0;i<18;i++){
      const bit = ((info >> i) & 1) === 1;
      set(Math.floor(i/3), size-11 + (i%3), bit);
      set(size-11 + (i%3), Math.floor(i/3), bit);
    }
  }

  // Data, zigzagging up and down two columns at a time from the bottom right.
  const words = qrCodewords(text, version);
  let bit = 0, upward = true;
  const nextBit = () => {
    const v = (words[bit >> 3] >> (7 - (bit & 7))) & 1;
    bit++;
    return v === 1;
  };
  for(let right = size-1; right > 0; right -= 2){
    if(right === 6) right = 5;                 // the timing column is not data
    for(let step=0; step<size; step++){
      const r = upward ? size-1-step : step;
      for(let c of [right, right-1]){
        if(fixed[r][c]) continue;
        m[r][c] = bit < words.length*8 ? nextBit() : false;
      }
    }
    upward = !upward;
  }

  return {matrix:m, fixed, size, version};
}

/* How unpleasant a masked symbol is for a scanner to read: long runs, solid
   blocks, patterns that look like a finder, and an unbalanced light/dark mix. */
function qrPenalty(m, size){
  let score = 0;
  const run = line => {
    let n = 1;
    for(let i=1;i<size;i++){
      if(line[i] === line[i-1]) n++;
      else { if(n >= 5) score += n - 2; n = 1; }
    }
    if(n >= 5) score += n - 2;
  };
  for(let r=0;r<size;r++) run(m[r]);
  for(let c=0;c<size;c++) run(m.map(row=>row[c]));

  for(let r=0;r<size-1;r++) for(let c=0;c<size-1;c++){
    const v = m[r][c];
    if(v===m[r][c+1] && v===m[r+1][c] && v===m[r+1][c+1]) score += 3;
  }

  const bad = [true,false,true,true,true,false,true,false,false,false,false];
  const bad2 = [false,false,false,false,true,false,true,true,true,false,true];
  const scan = line => {
    for(let i=0;i+11<=size;i++){
      let a = true, b = true;
      for(let j=0;j<11;j++){ if(line[i+j]!==bad[j]) a=false; if(line[i+j]!==bad2[j]) b=false; }
      if(a||b) score += 40;
    }
  };
  for(let r=0;r<size;r++) scan(m[r]);
  for(let c=0;c<size;c++) scan(m.map(row=>row[c]));

  let dark = 0;
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(m[r][c]) dark++;
  const pct = dark*100/(size*size);
  score += Math.floor(Math.abs(pct-50)/5)*10;
  return score;
}

const QR_MASKS = [
  (r,c)=>(r+c)%2===0,      (r,c)=>r%2===0,            (r,c)=>c%3===0,
  (r,c)=>(r+c)%3===0,      (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,
  (r,c)=>((r*c)%2)+((r*c)%3)===0,
  (r,c)=>(((r*c)%2)+((r*c)%3))%2===0,
  (r,c)=>(((r+c)%2)+((r*c)%3))%2===0
];

/* The finished symbol: the best of the eight masks, with its format bits. */
function qrEncode(text){
  const built = qrMatrix(text);
  if(!built) return null;
  const {fixed, size} = built;

  let best = null;
  for(let mask=0; mask<8; mask++){
    const m = built.matrix.map(row=>row.slice());
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      if(!fixed[r][c] && QR_MASKS[mask](r,c)) m[r][c] = !m[r][c];
    }
    // Format information, level M (00) with this mask, twice over.
    const raw = (0b00 << 3) | mask;
    const info = ((raw << 10) | qrBch(raw, 0b10100110111, 11)) ^ 0b101010000010010;
    const put = (r,c,v) => { m[r][c] = v; };
    for(let k=0;k<15;k++){
      const bit = ((info >> (14-k)) & 1) === 1;      // most significant first
      // The copy wrapped around the top-left finder.
      if(k < 6)        put(8, k, bit);
      else if(k === 6) put(8, 7, bit);
      else if(k === 7) put(8, 8, bit);
      else if(k === 8) put(7, 8, bit);
      else             put(14-k, 8, bit);
      // The copy split between the other two finders: seven modules climbing
      // the bottom-left column, then eight crossing the top-right row.
      if(k < 7) put(size-1-k, 8, bit);
      else      put(8, size-15+k, bit);
    }
    m[size-8][8] = true;                      // the dark module survives masking

    const score = qrPenalty(m, size);
    if(!best || score < best.score) best = {score, matrix:m, size};
  }
  return best;
}

function applySettings(s){
  if(!s || typeof s !== 'object') return;
  stock.items   = new Set(Array.isArray(s.items)   ? s.items   : []);
  stock.milks   = new Set(Array.isArray(s.milks)   ? s.milks   : []);
  stock.toppings= new Set(Array.isArray(s.toppings)? s.toppings: []);
  stock.pickups = new Set(Array.isArray(s.pickups) ? s.pickups : []);
  stock.pays    = new Set(Array.isArray(s.pays)    ? s.pays    : []);
  stock.prices  = (s.prices && typeof s.prices==='object') ? s.prices : {};
  if(s.branch && typeof s.branch==='object') stock.branch = Object.assign({}, BRANCH_DEFAULTS, s.branch);
  if(Array.isArray(s.spots)) stock.spots = s.spots.filter(x=>x && x.id);
  if(s.brk && typeof s.brk==='object') stock.brk = Object.assign({}, BREAK_DEFAULT, s.brk);
  stock.order = Array.isArray(s.order) ? s.order.filter(x=>typeof x==='string') : [];
  stock.cats = Array.isArray(s.cats) ? s.cats.filter(c=>c && c.id) : [];
  stock.menu = Array.isArray(s.menu) ? s.menu.filter(m=>m && m.id && m.price) : [];
  rebuildMenu();
  if(s.hours) DAYS.forEach(d=>{
    const h = s.hours[d.k];
    if(h && h.open && h.close) stock.hours[d.k] = {open:h.open, close:h.close, shut:!!h.shut};
  });
  if(OVERRIDE.some(o=>o.k===s.override)) stock.override = s.override;
  rebuildPickup();   // the branch may have renamed or replaced its pickup points
}

function cacheStock(){
  try{ localStorage.setItem('matchauchi_stock_v5', JSON.stringify(snapshot())); }catch(e){}
}

async function loadSettings(){
  try{
    const res = await fetch(API_SETTINGS, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    applySettings(await res.json());
    online = true;
    cacheStock();
    await loadBranchQr();
  }catch(e){
    online = false;          // preview or offline: carry on with the cached copy
  }
  paint();
}

let pushTimer = null;

}

async function pushSettings(){
  const key = ownerKey();
  if(!key) return;
  try{
    const res = await fetch(API_SETTINGS, {
      method:'PUT',
      headers:{'content-type':'application/json','x-owner-key':key},
      body: JSON.stringify(snapshot())
    });
    if(res.status === 401){
      try{ localStorage.removeItem(OWNER_KEY); }catch(e){}
      closeSheet(); paint();
      alert(bi('รหัสเจ้าของร้านไม่ถูกต้อง','That owner code was not accepted.'));
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
  }catch(e){
    alert(bi('บันทึกการตั้งค่าไม่สำเร็จ ลองอีกครั้ง','Could not save that change. Please try again.'));
  }
}

const OWNER_KEY = 'matchauchi_owner_key';
const ownerKey = () => { try{ return localStorage.getItem(OWNER_KEY) || ''; }catch(e){ return ''; } };
const isOwner = () => !!ownerKey();

/* ---- schedule ---- */
const dayKeyOf = d => DAYS[(d.getDay()+6)%7].k;        // JS weeks start Sunday
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = t => t;

function windowFor(key){
  const h = stock.hours[key];
  if(!h || h.shut) return null;
  let open = toMin(h.open), close = toMin(h.close);
  if(close <= open) close += 1440;                      // trades past midnight
  return {open, close};
}
function isOpenAt(now = new Date()){
  const today = windowFor(dayKeyOf(now));
  const mins = now.getHours()*60 + now.getMinutes();
  if(today && mins >= today.open && mins < today.close) return true;
  // a window that ran past midnight may still be running from yesterday
  const y = new Date(now); y.setDate(y.getDate()-1);
  const last = windowFor(dayKeyOf(y));
  return !!(last && last.close > 1440 && mins + 1440 < last.close && mins + 1440 >= last.open);
}
/* The next day the shop opens, for the "closed" message. */
function nextOpening(now = new Date()){
  for(let i=0;i<8;i++){
    const d = new Date(now); d.setDate(d.getDate()+i);
    const key = dayKeyOf(d), h = stock.hours[key];
    if(!h || h.shut) continue;
    if(i===0 && now.getHours()*60+now.getMinutes() >= toMin(h.open)) continue;
    const day = DAYS.find(x=>x.k===key);
    return {when: i===0 ? {th:'วันนี้',en:'today'} : i===1 ? {th:'พรุ่งนี้',en:'tomorrow'} : day, at:h.open};
  }
  return null;
}
/* True only while the errand is actually happening. Before it starts and
   after it ends the shop trades normally, which is what lets the break be set
   in advance and then forgotten about. */
function onBreak(now = new Date()){
  if(stock.override !== 'brk') return false;
  const mins = now.getHours()*60 + now.getMinutes();
  const from = toMin(stock.brk.from), to = toMin(stock.brk.to);
  return to > from ? (mins >= from && mins < to)      // same day
                   : (mins >= from || mins < to);     // runs past midnight
}
function shopStatus(){
  if(stock.override === 'brk') return onBreak() ? 'brk' : (isOpenAt() ? 'open' : 'closed');
  if(stock.override !== 'auto') return stock.override;
  return isOpenAt() ? 'open' : 'closed';
}
/* Trailing detail for the status bar: when we close, or when we next open. */
function statusDetail(){
  const s = shopStatus();
  if(s === 'busy') return '';        // the wait time already says enough
  if(s === 'brk'){
    return bi('คาดว่าจะกลับมาเปิดประมาณ '+fmt(stock.brk.to),
              'expected to reopen around '+fmt(stock.brk.to));
  }
  if(s === 'closed'){
    const n = nextOpening();
    return n ? bi('เปิด'+n.when.th+' '+fmt(n.at), 'opens '+n.when.en+' '+fmt(n.at)) : '';
  }
  const w = stock.hours[dayKeyOf(new Date())];
  return (w && !w.shut) ? bi('ถึง '+fmt(w.close), 'until '+fmt(w.close)) : '';
}

const app = {view:'home', cat:null, id:null, draft:null, cart:[], form:{name:'',phone:'',pickup:null,pickupNote:'',pay:null,note:'',slip:null}, sheet:null, touched:false, sending:false, sendError:null, receipt:null};

function go(view, extra){ Object.assign(app, {view}, extra||{}); paint(); window.scrollTo(0,0); }
function openItem(id){
  // Switched off is switched off for customers. The shop still needs to be
  // able to open one -- to read the notes, or check a price before reopening
  // it -- so only a customer is turned away here.
  if(itemOff(item(id)) && !isOwner()) return;
  const open = openTiers(item(id));
  // Nothing is chosen on the customer's behalf -- every option is a deliberate tap.
  app.draft = {milk: open.length===1 ? open[0].k : null, syrup:null, sweet:null, topping:null, straw:null, bag:null, ice:null, qty:1};
  go('detail', {id});
}
function pick(field, k){
  if(field==='milk' && stock.milks.has(k)) return;
  if(field==='topping' && stock.toppings.has(k)) return;
  app.draft[field] = k; paint();
}
const bump = d => { app.draft.qty = Math.max(1, app.draft.qty+d); paint(); };

function addToCart(){
  const it = item(app.id), open = openTiers(it);
  const milk = app.draft.milk || (open[0] && open[0].k);
  const tier = open.find(t=>t.k===milk);
  if(!tier) return;
  app.cart.push({uid:Date.now()+Math.random(), id:it.id, qty:app.draft.qty, milk,
    syrup:app.draft.syrup, sweet:app.draft.sweet, straw:app.draft.straw, bag:app.draft.bag, ice:app.draft.ice,
    topping:app.draft.topping,
    unit:tier.price + extrasFor(app.draft)});

}
const drop = uid => { app.cart = app.cart.filter(c=>c.uid!==uid); paint(); };

/* Change a cup count from inside the cart. Going below one removes the line
   rather than leaving a zero-quantity row sitting there. */
function reQty(uid, delta){
  const line = app.cart.find(c=>c.uid===uid);
  if(!line) return;
  const next = line.qty + delta;
  if(next < 1){ drop(uid); return; }
  line.qty = Math.min(99, next);
  paint();
}
const total = () => app.cart.reduce((s,c)=>s+c.unit*c.qty, 0);

function pickSlip(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){
    alert(bi('ไฟล์ใหญ่เกิน 8MB กรุณาเลือกไฟล์ที่เล็กกว่า','That file is over 8MB. Please choose a smaller image.'));
    input.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = e => { app.form.slip = {name:file.name, size:file.size, url:e.target.result}; paint(); };
  reader.onerror = () => alert(bi('อ่านไฟล์ไม่สำเร็จ กรุณาลองใหม่','Could not read that file. Please try again.'));
  reader.readAsDataURL(file);
}

function orderPayload(){
  const f = app.form;
  const spot = PICKUP.find(p=>p.k===f.pickup);
  // For "other location" the place the customer typed is what the shop needs.
  const where = spot && spot.free && f.pickupNote.trim()
    ? bi(spot.th,spot.en)+': '+f.pickupNote.trim()
    : labelOf(PICKUP, f.pickup);
  return {
    customer:{ name:f.name.trim(), phone:f.phone.trim() },
    pickup: where,
    pay: labelOf(PAY, f.pay),
    note: f.note.trim(),
    lines: app.cart.map(c=>({
      qty:c.qty,
      name:item(c.id).name,
      options:[bi(MILK[c.milk].th, MILK[c.milk].en),
        SYRUP.find(s=>s.k===c.syrup).th, SWEET.find(s=>s.k===c.sweet).th,
        (t=>t ? t.th + (t.add?' +'+baht(t.add):'') : '')(TOPPING.find(s=>s.k===c.topping)),
        STRAW.find(s=>s.k===c.straw).th,
        BAG.find(s=>s.k===c.bag).th + (bagAdd(c.bag)?' +'+baht(bagAdd(c.bag)):''),
        (ICE.find(s=>s.k===c.ice)||{}).th || ''].filter(Boolean).join(' · '),
      amount:c.unit*c.qty
    })),
    slip: f.slip ? {name:f.slip.name, dataUrl:f.slip.url} : null
  };
}

async function submit(){
  app.touched = true;
  if(Object.keys(missing()).length){
    paint();
    const first = document.querySelector('.err');
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(app.sending) return;

  // No backend (the standalone preview): say so rather than fake a sent order.
  if(!online){
    app.receipt = {no:null, delivered:false, preview:true};
    go('done'); return;
  }

  app.sending = true; app.sendError = null; paint();
  try{
    const res = await fetch(API_ORDER, {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify(orderPayload())
    });
    const data = await res.json().catch(()=>({}));

    if(res.status === 409){                       // shop closed while they typed
      app.sending = false; stock.override = 'closed'; paint();
      alert(data.message || bi('ขณะนี้ร้านปิดรับออเดอร์','The shop is closed for orders right now'));
      return;
    }
    if(!res.ok || !data.ok) throw new Error(data.error || ('HTTP '+res.status));

    const cups = count();
    app.receipt = {no:data.orderNo, delivered:!!data.delivered,
                   cups, readyAt: Date.now() + waitMs(cups)};
    app.sending = false;
    go('done');
  }catch(e){
    app.sending = false;
    app.sendError = bi('ส่งออเดอร์ไม่สำเร็จ กรุณาลองใหม่หรือโทรหาร้าน',
                       'Could not send your order. Please try again or call the shop.');
    paint();
    const note = document.querySelector('.err');
    if(note) note.scrollIntoView({behavior:'smooth', block:'center'});
  }
}
/* The shop makes each cup to order, so the wait scales with the order. The
   customer is told 7-9 minutes a cup and the clock runs to the far end of
   that, so it never sends them to the counter before the drinks are up. */
const PER_CUP_MIN = 9;
const waitMs = cups => cups * PER_CUP_MIN * 60000;

let cdTimer = null;
/* Started and stopped by paint(), so the clock only exists while the
   confirmation screen is on the page. */
function syncCountdown(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer = null; }
  const r = app.receipt;
  if(app.view !== 'done' || !r || !r.readyAt || Date.now() >= r.readyAt) return;
  cdTimer = setInterval(tickCountdown, 1000);
}
/* Time left is measured against a fixed deadline rather than counted down, so
   a locked phone -- where the browser stops running timers -- comes back
   showing the right number instead of however far it got. */
function tickCountdown(){
  const el = document.getElementById('cdTime');
  if(!el) return;
  const left = app.receipt.readyAt - Date.now();
  if(left <= 0){ paint(); return; }              // repaints into the bell state
  const secs = Math.ceil(left/1000);
  el.textContent = String(Math.floor(secs/60)).padStart(2,'0')+':'+
                   String(secs%60).padStart(2,'0');
}

/* Flip one switch in place. Re-rendering the whole sheet would rebuild its DOM
   and throw away the reader's scroll position, bouncing them back to the top on
   every tap. */
function flipStock(set, key, sel){
  set.has(key) ? set.delete(key) : set.add(key);
  saveStock();
  const sw = document.querySelector(sel);
  if(sw) sw.classList.toggle('on', !set.has(key));

/* Re-sort one category the moment a switch is flipped, by moving the existing
   rows rather than rebuilding the sheet -- rebuilding would reset the scroll
   position. Total height is unchanged, so the scroll offset stays valid, and
   each moved row is animated from where it was so the change is followed by
   the eye instead of things silently teleporting. */
function resortCategory(catId){
  const band = document.querySelector('.cat-band[data-cat="'+catId+'"]');
  if(!band) return;

  const rows = [];
  for(let n = band.nextElementSibling; n && n.classList.contains('item-stock'); n = n.nextElementSibling){
    rows.push(n);
  }
  if(rows.length < 2) return;

  const menuOrder = ITEMS.filter(i=>i.cat===catId).map(i=>i.id);
  const sorted = rows.slice().sort((a,b)=>
    (stock.items.has(a.dataset.stock) - stock.items.has(b.dataset.stock)) ||
    (menuOrder.indexOf(a.dataset.stock) - menuOrder.indexOf(b.dataset.stock)));

  if(sorted.every((row,i)=>row===rows[i])) return;   // already in place

  const before = new Map(rows.map(r=>[r, r.getBoundingClientRect().top]));
  band.after(...sorted);

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  sorted.forEach(r=>{
    const shift = before.get(r) - r.getBoundingClientRect().top;
    if(!shift) return;
    r.animate(
      [{transform:'translateY('+shift+'px)'}, {transform:'translateY(0)'}],
      {duration:280, easing:'cubic-bezier(.2,.7,.3,1)'}
    );
  });
}

/* Phone cameras produce files far larger than a menu thumbnail needs, so the
   picture is resized in the browser before it is ever sent. */
async function shrinkImage(file, max){
  const url = URL.createObjectURL(file);
  try{
    const im = await new Promise((res, rej)=>{
      const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = url;
    });
    const scale = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * scale);
    c.height = Math.round(im.height * scale);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const webp = c.toDataURL('image/webp', 0.82);
    // Safari used to hand back a PNG here; the server takes either.
    return webp.indexOf('data:image/webp') === 0 ? webp : c.toDataURL('image/jpeg', 0.86);
  } finally { URL.revokeObjectURL(url); }
}

async function uploadItemPhoto(input, id){

  input.value = '';

      body: JSON.stringify({id, dataUrl})

async function uploadBranchQr(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 3 * 1024 * 1024){
    alert(bi('ไฟล์ใหญ่เกิน 3MB','That file is over 3MB.')); input.value=''; return;
  }
  const dataUrl = await new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = e => resolve(e.target.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  }).catch(()=>null);
  if(!dataUrl){ alert(bi('อ่านไฟล์ไม่สำเร็จ','Could not read that file.')); return; }

  try{
    const res = await fetch(API_QR, {
      method:'PUT',
      headers:{'content-type':'application/json','x-owner-key':ownerKey()},
      body: JSON.stringify({dataUrl})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
    await loadBranchQr();
    paintSheet(); paint();
  }catch(e){
    alert(bi('อัปโหลด QR ไม่สำเร็จ','Could not upload that QR.')+'\n'+e.message);
  }
}

/* Either the clock, or -- once it has run out -- what to do about it. */
function waitBlock(r){
  const bell = '<svg class="bell" viewBox="0 0 24 24" fill="none">'+
    '<path d="M6 9a6 6 0 0 1 12 0c0 4.2 1.2 5.6 1.9 6.3.4.4.1 1.1-.5 1.1H4.6c-.6 0-.9-.7-.5-1.1C4.8 14.6 6 13.2 6 9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>'+
    '<path d="M10 20a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const cups = r.cups || 1;
  const secs = Math.max(0, Math.ceil((r.readyAt - Date.now())/1000));
  const mmss = String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');

  if(secs <= 0){
    return '<div class="wait ring">'+bell+
      '<span class="big">'+bi('ครบเวลาแล้วค่ะ','Your matcha should be ready')+'</span>'+
      '<p class="note">กดกริ่งที่กำแพงเพื่อเรียกแม่ค้าได้เลยค่ะ<br>'+
      'Please ring the bell on the wall to let แม่ค้า know you are waiting.</p>'+
      '<p class="note soft">ถ้ายังไม่ได้รับ อาจมีออเดอร์ก่อนหน้าอยู่ ต้องขออภัยด้วยนะคะ<br>'+
      'If it is not ready yet, there may be orders ahead of yours — sorry for the wait.</p></div>';
  }
  return '<div class="wait">'+
    '<span class="lbl">'+bi('พร้อมรับในอีกประมาณ','Ready in about')+'</span>'+
    '<span class="clock" id="cdTime">'+mmss+'</span>'+
    '<p class="note">ทางร้านชงสดทีละแก้ว ใช้เวลาประมาณ 7–9 นาทีต่อ 1 แก้ว ('+cups+' แก้ว)<br>'+
    'Every cup is whisked to order — about 7–9 minutes each ('+cups+' '+(cups>1?'cups':'cup')+').</p>'+
    '<p class="note soft">หากมีออเดอร์ก่อนหน้าคิวของคุณ อาจใช้เวลานานกว่าที่แจ้งไว้เล็กน้อย ต้องขออภัยด้วยนะคะ ขอบคุณที่รอค่ะ<br>'+
    'If there are orders ahead of yours this may run a little longer than the time shown. We are sorry to keep you waiting, and thank you for your patience.</p></div>';
}

/* A quarter-hour grid keeps the picker to a short, scannable list rather than
   the browser's fiddly time spinner. Any saved time off the grid is preserved. */
function timeChoices(current){
  const list = [];
  for(let m=0; m<24*60; m+=15){
    list.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
  }
  if(current && !list.includes(current)){ list.push(current); list.sort(); }
  return list;
}
const timeSelect = (day, part, value, shut, label) =>
  '<select class="timesel" data-day="'+day+'"'+(shut?' disabled':'')+
  ' onchange="setHours(\''+day+'\',\''+part+'\',this.value)" aria-label="'+esc(label)+'">'+
  timeChoices(value).map(t=>'<option value="'+t+'"'+(t===value?' selected':'')+'>'+t+'</option>').join('')+
  '</select>';

const breakSelect = (part, value) =>
  '<select class="timesel" data-brk="'+part+'" onchange="setBreak(\''+part+'\',this.value)" '+
  'aria-label="'+esc(part==='from'?'Break start':'Break end')+'">'+
  timeChoices(value).map(t=>'<option value="'+t+'"'+(t===value?' selected':'')+'>'+t+'</option>').join('')+
  '</select>';

const shopUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');

  return '<div class="qr-show"><canvas id="shopQr"></canvas>'+

/* Drawn after the sheet is in the document, because it needs the canvas. */
function drawShopQr(){
  const cv = document.getElementById('shopQr');
  if(!cv) return;
  const q = qrEncode(shopUrl());
  if(!q){ cv.remove(); return; }
  const scale = 10, quiet = 4;          // four light modules, as the spec asks
  const px = (q.size + quiet*2) * scale;
  cv.width = px; cv.height = px;
  const g = cv.getContext('2d');
  // Plain dark on plain light: the kraft texture belongs around the code, not
  // under it, where it costs a scanner contrast.
  g.fillStyle = '#FBF9F4'; g.fillRect(0, 0, px, px);
  g.fillStyle = '#2A2118';
  for(let r=0;r<q.size;r++) for(let c=0;c<q.size;c++){
    if(q.matrix[r][c]) g.fillRect((c+quiet)*scale, (r+quiet)*scale, scale, scale);
  }
}

async function copyShopLink(){
  const url = shopUrl();
  try{
    await navigator.clipboard.writeText(url);
  }catch(e){
    // Older phones, or a page without clipboard permission.
    const box = document.createElement('textarea');
    box.value = url; box.setAttribute('readonly', '');
    box.style.cssText = 'position:fixed;top:-100px';
    document.body.appendChild(box); box.select();
    try{ document.execCommand('copy'); }catch(e2){}
    box.remove();
  }
  toast(bi('คัดลอกลิงก์แล้ว','Link copied'));
}

async function shareShopLink(){
  try{
    await navigator.share({title:'MatchaUchi', text:bi('สั่งมัทฉะจากร้านเราได้เลย','Order matcha from us'), url:shopUrl()});
  }catch(e){ /* the reader closed the share sheet */ }
}

function saveShopQr(){
  const cv = document.getElementById('shopQr');
  if(!cv) return;
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'matchauchi-qr.png';
  document.body.appendChild(a); a.click(); a.remove();
}

/* One row per item: the on/off switch, then a price box for every serving style
   it offers. Goodmate is shown but not editable -- it tracks OATSIDE + 10. */
function itemStockRow(it){
  const on = !stock.items.has(it.id);
  const boxes = MILK_ORDER.filter(k=>k==='goodmate'
      ? Object.keys(it.price).includes('oatside')
      : Object.keys(it.price).includes(k))
    .map(k=>{
      const label = MILK_SHORT[k] || k;
      if(k==='goodmate'){
        return '<span class="pricebox derived" title="OATSIDE + 10">'+
          '<span class="plabel">'+esc(label)+'</span>'+
          '<span class="pderived" data-derived="'+it.id+'">'+(priceOf(it,'oatside')+10)+'</span></span>';
      }
      return '<span class="pricebox"><span class="plabel">'+esc(label)+'</span>'+
        '<input type="number" min="0" max="9999" step="1" inputmode="numeric" '+
        'value="'+priceOf(it,k)+'" data-price="'+it.id+'" data-tier="'+k+'" '+
        'onchange="setPrice(\''+it.id+'\',\''+k+'\',this.value)" '+
        'aria-label="'+esc(it.name+' '+label)+'"></span>';
    }).join('');

  return '<div class="item-stock'+(on?'':' off')+'" data-stock="'+it.id+'">'+
    '<div class="item-stock-top"><span class="lbl">'+esc(it.name)+'</span>'+
      '<button class="sw'+(on?' on':'')+'" data-item="'+it.id+'" onclick="flipItem(\''+it.id+'\')" aria-label="'+esc(it.name)+'"></button></div>'+
    '<div class="pricerow">'+boxes+'</div></div>';
}

/* Blank or nonsense reverts that tier to its printed price. */
function setPrice(id, tier, raw){
  const n = Math.round(Number(raw));
  const box = stock.prices[id] || (stock.prices[id] = {});
  if(!Number.isFinite(n) || n < 0 || String(raw).trim()===''){
    delete box[tier];
  } else {
    box[tier] = n;
  }
  if(!Object.keys(box).length) delete stock.prices[id];

  const it = item(id);
  const field = document.querySelector('input[data-price="'+id+'"][data-tier="'+tier+'"]');
  if(field) field.value = priceOf(it, tier);
  // Goodmate follows OATSIDE, so refresh it in place.
  if(tier==='oatside'){
    const derived = document.querySelector('[data-derived="'+id+'"]');
    if(derived) derived.textContent = priceOf(it,'oatside')+10;
  }
  saveStock();
}

/* Which sheet the DOM currently holds. Re-rendering the same one must keep
   the reader where they were -- adding or deleting a row used to hand them
   back to the top of a long list -- while moving to a different sheet starts
   at the top, as arriving somewhere new should. */
let paintedSheet = null;
function paintSheet(){
  const cur = document.getElementById('veil');
  if(!app.sheet){ if(cur) cur.remove(); paintedSheet = null; return; }
  const box = cur && cur.querySelector('.sheet');
  const keep = (box && paintedSheet === app.sheet) ? box.scrollTop : 0;
  const s = SHEETS[app.sheet];
  const html = '<div class="veil" id="veil" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+
    '<div class="sheet-head"><div><h2>'+esc(s.title)+'</h2>'+
      '<p>'+esc(s.note)+'<br>'+esc(online
        ? bi('บันทึกอัตโนมัติ ทุกเครื่องเห็นตรงกัน','Saved automatically — every device sees the same shop.')
        : bi('ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์ บันทึกในเครื่องนี้เท่านั้น','Not connected to the server — saved on this device only.'))+'</p></div>'+
      '<button onclick="closeSheet()" aria-label="ปิด">✕</button></div>'+
    s.body()+'</div></div>';
  if(cur) cur.outerHTML = html; else document.body.insertAdjacentHTML('beforeend', html);
  paintedSheet = app.sheet;
  if(app.sheet === 'share') drawShopQr();   // the canvas has to exist first
  if(keep){
    const fresh = document.querySelector('#veil .sheet');
    if(fresh) fresh.scrollTop = keep;
  }
}

/* An installed app has no address bar, so #manage cannot be typed into it --
   and on iOS what the home-screen app stores is separate from Safari, so an
   owner who set the code up in the browser arrives here without it. Five taps
   on the branch line asks for the code, which no customer will do by accident
   and which needs no visible control on a page customers also read. */
(function(){
  let taps = 0, timer = null;
  const line = document.getElementById('branchLine');
  if(!line) return;
  line.addEventListener('click', ()=>{
    if(isOwner()) return;
    clearTimeout(timer);
    timer = setTimeout(()=>{ taps = 0; }, 2500);
    if(++taps < 5) return;
    taps = 0; clearTimeout(timer);
    askOwner();
  });
})();

try{ claimOwner(); }catch(e){}
paint();
loadSettings();   // then repaint with whatever the shop has actually set

/* Appending #manage to a page that is already open is a same-document change,
   so nothing would reload -- pick it up here too. */
window.addEventListener('hashchange', () => {
  try{ claimOwner(); }catch(e){}
  paint();
});

/* Follow the clock, so the banner flips at opening and closing time on a page
   left sitting open. Only the banner is redrawn -- never the form beneath it. */
let lastShown = shopStatus();
setInterval(() => {
  const now = shopStatus();
  paintStatus();
  if(now !== lastShown){
    lastShown = now;
    if(app.view === 'checkout') paint();   // refresh the closed-shop notice
  }
}, 30000);
</script>
